    Italian, stocked by independents in both markets. Relevant to the Soft Autumn
    rule that black is allowed below the waist and in leather and hardware —
    a black belt is in-palette where a black scarf is not. The matcher reads
    the accessory's near_face flag (matching.md §2, stage 1): a belt is false
    and scores as hardware; a scarf is true and scores under the top slot's

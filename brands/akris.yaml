notes: >
  St. Gallen. Founded 1922 by Alice Kriemler-Schoch and run by the third
  generation of the family.
  The Swiss entry in this list, and the one closest to home for a reader in
  Switzerland — relevant to the newsletter's stated perspective even where the
  price puts it out of reach for most readers.
  UNVERIFIED: production locations and the current split between Swiss and other
  European manufacture.

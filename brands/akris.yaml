construction_notes: >
  Double-face cloth is the house technique: two faces joined without a lining, so
  the garment has no wrong side and is finished by hand at the edges. That is a
  top-of-scale rubric field 2 marker and is also expensive to do, which makes the
  price coherent under field 4. Horsehair is used in accessories rather than
  clothing.
rubric_score:

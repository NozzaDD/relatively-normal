partnership_tier: first
notes: >
  Milan. Founded 2006 by Massimo Alba, who worked in knitwear before starting the
  label. Soft, unstructured, colour-led — the corduroy trousers and garment-dyed
  cashmere are the entry points.
  UNVERIFIED: ownership structure. Founder-led in practice; the legal form is not
  confirmed, so ownership stays unknown rather than family.
  Colour interest here is high for a Soft Autumn palette — the muted, dusty end of
  the range is the house register.

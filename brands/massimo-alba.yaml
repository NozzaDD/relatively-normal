construction_notes: >
  Garment dyeing is the house technique — pieces are dyed after making, which is
  what produces the washed, slightly uneven colour the brand is known for. That
  process is directly relevant to rubric field 1 (the dye process is named) and to
  how colours read against a palette: garment-dyed colour is rarely flat, so a
  single hex sample understates it.

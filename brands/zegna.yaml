partnership_tier: later
notes: >
  Trivero, Biella. Founded 1910 by Ermenegildo Zegna. Publicly listed since 2021
  with the family retaining control.
  The mill ownership makes Zegna useful as a reference point when explaining why
  rubric field 3 exists at all, separately from whether a reader would buy the
  clothes.
  UNVERIFIED: the named material programmes (traceable cashmere and linen
  initiatives) — the brand publishes these; confirm the specifics before
  describing any of them, and do not treat them as a sustainability claim unless
  a rubric field supports it.

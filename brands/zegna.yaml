construction_notes: >
  The distinguishing fact is vertical integration: Zegna owns its wool mill in
  Biella, so cloth and garment come from the same company. That is the clearest
  rubric field 3 case in this list — mill named, verifiable, and owned rather
  than sourced.
rubric_score:

notes: >
  Lombardy, with roots in Gambara (Brescia) going back to the end of the
  nineteenth century.
  UNVERIFIED: current ownership. The brand began as a family business and is
  widely reported to have changed hands since; the current owner is not confirmed
  here, so ownership stays unknown. Do not describe it as family-run without
  checking.

construction_notes: >
  Known for the unstructured, garment-dyed jacket — the K-Jacket — with the
  lining and padding stripped out and the finished jacket dyed as a whole. Strong
  on softness and colour, deliberately light on the structural markers that
  rubric field 2 rewards in formal tailoring. Score it for what it is rather than
  against a canvassed jacket.

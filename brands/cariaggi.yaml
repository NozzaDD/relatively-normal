notes: >
  Cagli, Marche. Founded in the late 1950s. Supplies cashmere yarn to luxury
  knitwear houses.
  UNVERIFIED and important: a minority stake in Cariaggi is widely reported to
  have been acquired by Brunello Cucinelli. Ownership is recorded as family on
  the strength of its history, but this needs confirming — if the stake is real,
  the ownership field and the Cucinelli notes both need updating.
  Editorial value is the same as Piacenza's: this is where a cashmere story
  actually starts.

name: Merz b. Schwanen
slug: merz-b-schwanen
country: Germany
ownership: unknown
price_band: mid
core_materials:
  - cotton jersey (loopwheeled)
  - wool
construction_notes: >
  Loopwheeled jersey — knitted on original circular looms that run slowly and
  with almost no tension, producing a tubular body with no side seams. This is a
  genuine rubric field 2 marker and one of the few in this list that is visible
  in the finished garment: no side seam, a dense, slightly heavy hand, and a
  fabric that resists twisting after washing.
rubric_score:
affiliate_available: unknown
partnership_tier: first
notes: >
  Swabia (Albstadt). The original company dates to 1911; the brand was revived in
  2011 around the surviving loopwheel machines. Confirm the revival details
  before repeating them in writing — the 1911/2011 framing is widely quoted and
  worth checking at source.
  Best partnership candidate in this list on fit: German, small, one clear
  material story, and a product that can be explained in two sentences.
  Price sits high for a t-shirt and is defensible on construction — a good worked
  example for rubric field 4, where the question is coherence, not cheapness.

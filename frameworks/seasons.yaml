# seasons.yaml — base palettes for the twelve seasons
# Tiers: foundations 55% / supporting 30% / accents 15% of a wardrobe.
# Hex values are representative anchors, not exhaustive lists. The matcher
# scores by Lab distance to these anchors, so each tier needs spread, not volume.
# `avoid` = the clearest misses for that season; used to flag hard failures.
# `black` and `white` = where those two can sit relative to the face.
# `denim` = where denim can sit. Denim is identified by an item's declared fibre,
#   never by its colour (matching.md §2); every season admits it below the waist.
# `contrast` = the natural contrast level to dress to.
# `directions` = named leans within the season, selected by the intake questions.
# `corporate` = the anchors that read as appropriate in a formal workplace (matching.md §3, context check).
# Black is on every list; the slot rules already govern where it sits.
#
# Invariant: a `black` or `white` rule may only name a colour that exists as an
# anchor in this file (CLAUDE.md, hard rule 5). White rules resolve against the
# season's own white-named anchor (cream / soft white / warm white / pure white);
# `anywhere` resolves against whichever of those the season carries. Black rules
# resolve against 000000, which counts as present when it sits in the tiers or
# in the `avoid` list.

light_spring:
  primary: light
  secondary: warm
  metal: gold
  contrast: low-medium
  black: away_from_face
  white: cream_only
  denim: admitted_below_waist
  foundations: [{name: warm ivory, hex: "F5EBD8"}, {name: cream, hex: "EFE6D3"}, {name: camel, hex: "C9A66B"}, {name: light warm grey, hex: "C8C2B4"}, {name: soft navy, hex: "3F4F6B"}, {name: warm taupe, hex: "B8A48A"}, {name: pebble, hex: "89837D"}, {name: warm charcoal, hex: "403A35"}]  # cream added so `white: cream_only` names an anchor — hex reused from Soft Autumn, owner to confirm — pebble added as the mid neutral; warm charcoal added as the dark neutral — hex chosen inside the season's warm temperature, owner to confirm
  supporting: [{name: peach, hex: "F2B58B"}, {name: warm aqua, hex: "8FD1C8"}, {name: light coral, hex: "F08A7A"}, {name: butter yellow, hex: "F3DC8C"}, {name: leaf green, hex: "9BC46A"}]
  accents: [{name: bright coral, hex: "FF6F61"}, {name: turquoise, hex: "3FBFBF"}, {name: warm pink, hex: "F48FB1"}, {name: golden yellow, hex: "F5C531"}]
  avoid: ["000000", "8B008B", "4B0082", "708090"]
  corporate: [warm ivory, cream, light warm grey, soft navy, black]  # derived by the rule C* <= 21 and (L* <= 40 or C* <= 11), which reproduces Soft Autumn's list — owner to confirm
  directions:
    fresh: {anchor: warm aqua, note: "clear pastels, aqua and coral"}
    golden: {anchor: camel, note: "warm neutrals, butter and peach"}


# content/backlog.yaml
# One place for every note, post, series and campaign idea.
# Each entry has a trigger. Ideas that depend on something happening first
# carry a milestone or date; they surface automatically when it's reached.
#
# type:     note | post | series | campaign
# trigger:  kind: none        -> evergreen, can run any time
#           kind: date        -> on or after `from`, optionally until `to`
#           kind: milestone   -> when data/metrics.yaml shows metric >= value
#           kind: event       -> after a named thing has happened
# status:   idea | drafted | scheduled | published | dropped
#
# A session asked to "show what's ready" reads data/metrics.yaml, checks every
# trigger, and lists what can run now. Nothing here is ever deleted; it's
# marked published or dropped, so the record of what worked stays.

# A top-level key cannot sit above a top-level list in one YAML document, so this
# is the list's first entry: readers look for the entry carrying a metrics_file key.
- metrics_file: data/metrics.yaml

# ---------------------------------------------------------------------------
# MILESTONE POSTS — the origin story, told in pieces, each at its moment
# ---------------------------------------------------------------------------

- id: ipad-first-100
  type: post
  title: How my iPad got me my first hundred subscribers
  angle: >
    Everyone writes "how I got started". The angle here is the device and the guilt.
    For months this ran on my work laptop, which was never quite allowed and always
    felt restricted — every session carried a small sense of doing the wrong thing.
    Moving to an iPad and cloud sessions removed the friction and the guilt at once,
    and the subscriber count followed. The post is about what permission does to output.
  trigger: {kind: milestone, metric: free_subscribers, value: 100}
  status: idea
  source: Nora, 2026-09-15
  notes: >
    Do not publish at 100 exactly; publish when it's a clean round number the reader
    can see on the profile. Include the actual dates — the iPad arrived 2 Sept 2026.


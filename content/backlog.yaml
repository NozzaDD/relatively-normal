# ---------------------------------------------------------------------------
# ANGLES — positions the whole newsletter returns to
# ---------------------------------------------------------------------------

- id: angle-attention
  type: series
  title: Where you put your attention is the whole game
  angle: >
    The attention economy wants you looking at everything. A palette you trust is a filter:
    "I love it, but it's pink, and pink next to my face isn't for me" — and that is a relief,
    not a loss. The tool, used right, removes noise. What's left is calm, confidence, and more
    pleasure, not less: you can look at something beautiful and simply enjoy that it exists.
    "Oh my god it's beautiful, I really enjoy looking at it" — full stop. That's the shift.
  trigger: {kind: none}
  status: idea
  source: Nora, 2026-09-15
  notes: >
    A main angle. Works as notes (one line: the pink example), as a weekly post (the argument),
    and as the frame for the launch essay. It is the emotional case for the whole product.

- id: angle-stylist-in-your-pocket
  type: series
  title: The stylist in your pocket
  angle: >
    We want to be the friend you text before you buy. Every budget, every location, every
    colour season, every body shape. Not a magazine that assumes you live in New York and
    have a magazine budget. A friend who knows your wardrobe and tells you the truth.
  trigger: {kind: none}
  status: idea
  source: Nora, 2026-09-15
  notes: >
    Positioning, not a single post. "Every body shape" is a product commitment: the tool
    extends into body shape later, which is where the Closet Coup body-visualisation work
    comes back in. Colour first, shape second.

- id: post-reverse-engineered-outfits
  type: post
  title: I saved the outfits I kept going back to, then worked out why they worked
  angle: >
    Not a method invented and then applied. Screenshots collected over months, looked at
    properly, and the pattern underneath them written down: opposed hue, matched softness,
    a wide gap in lightness. Show the outfits, then show the rule they were all obeying.
    Ends with the ask — I'll do this for four people's October work wardrobes.
  trigger: {kind: none}
  status: idea
  source: Nora, 2026-09-15
  notes: >
    The recruitment post for the trial. The outfits come first and the method second;
    that order is the whole persuasion.

- id: series-nature-palettes
  type: series
  title: This is why that flower works, and here it is as an outfit
  angle: >
    Everyone posts a beautiful image and says look at these colours. Nobody says why.
    Pull the palette out of the image, run the three tests on it — opposed hue, matched
    relative chroma, wide value gap — and show the number. Then the wearable version:
    the same relationship built from clothes. The explanation is the differentiator;
    the pretty picture is table stakes.
  trigger: {kind: none}
  status: idea
  source: Nora, 2026-09-15
  notes: >
    Draws from content/swipe/visuals/. Long term this becomes a tool feature — upload an
    image you love, get its wearable palette. The format teaches the product.

- id: series-artworks-reverse-engineered
  type: series
  title: The paintings I keep going back to, and the rule they all obey
  angle: >
    Same move as the outfits post, applied to art already saved as style inspiration.
    Why these works hold together, shown with the three tests rather than asserted.
  trigger: {kind: none}
  status: idea
  source: Nora, 2026-09-15
  notes: Draws from content/swipe/artworks/.

- id: post-before-and-after
  type: post
  title: My outfits before the tool, and my outfits after
  angle: >
    The most reliable format there is, with something most before-and-afters lack —
    a method behind the change rather than better lighting. Same wardrobe, different
    decisions, and the rule that produced them.
  trigger: {kind: event, name: trial_round_1_complete}
  status: idea
  source: Nora, 2026-09-15

- id: series-trial-feedback
  type: series
  title: What four strangers said about their October work wardrobes

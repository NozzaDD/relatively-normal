- id: series-building-in-public
  type: series
  title: Building the thing, out loud
  angle: >
    A running thread from now until launch. Not a product announcement — the decisions,
    the corrections, the day the rule turned out to be wrong. Starts before any ask is
    made, so the trial recruitment lands as the next beat rather than a cold pitch.
  trigger: {kind: none}
  status: idea
  source: Nora, 2026-09-15
  notes: >
    Start this week. The recruitment post (post-reverse-engineered-outfits) should
    arrive third or fourth in the thread, not first.

# ---------------------------------------------------------------------------
# RULES that live with the backlog
# ---------------------------------------------------------------------------
# - Two notes a day. Never link the newsletter in the first note of the day.
# - Ten minutes replying on other people's notes — that's where profile clicks come from.
# - Sustainability is an ethic shown in what you do and don't buy, never a topic led with.
# - A short "what I actually bought" list is the trusted form of affiliate links.
# - Milestone posts publish at the moment, not months later. That is what this file is for.
